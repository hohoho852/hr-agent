<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">HR Agent — Public demo on Streamlit Community Cloud</title>
  <desc id="desc">Browser to Streamlit Cloud to query engine and LLM; sample handbook ingested via local BGE into Chroma; secrets, spend guards, query log, and eval gate.</desc>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <text x="28" y="36" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#172033">HR Agent — Public demo architecture (Streamlit Community Cloud)</text>
  <text x="28" y="58" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#5b6475">Live sample handbook · citations · spend guards · eval gate · cost/latency log · not private SSO production</text>

  <!-- zones -->
  <rect x="20" y="78" width="960" height="168" rx="12" fill="#eef2ff" stroke="#64748b" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="36" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#172033">Request path</text>

  <rect x="20" y="262" width="960" height="150" rx="12" fill="#ecfdf5" stroke="#64748b" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="36" y="284" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#172033">Knowledge path (sample handbook → local index)</text>

  <rect x="20" y="428" width="960" height="150" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="36" y="450" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#172033">Ops on the demo</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- request nodes -->
  <rect x="40" y="120" width="150" height="70" rx="10" fill="#bfdbfe" stroke="#64748b"/>
  <text x="82" y="150" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Browser</text>
  <text x="58" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">employee / evaluator</text>

  <rect x="230" y="114" width="190" height="82" rx="10" fill="#c7d2fe" stroke="#64748b"/>
  <text x="258" y="144" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Streamlit Cloud</text>
  <text x="258" y="164" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">app.py chat UI</text>
  <text x="248" y="180" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">session limit + cooldown</text>

  <rect x="460" y="114" width="190" height="82" rx="10" fill="#c7d2fe" stroke="#64748b"/>
  <text x="502" y="144" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Query engine</text>
  <text x="482" y="164" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">retrieve top 4 chunks</text>
  <text x="478" y="180" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">answer + cite sources</text>

  <rect x="690" y="120" width="170" height="70" rx="10" fill="#fde68a" stroke="#64748b"/>
  <text x="732" y="150" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">LLM API</text>
  <text x="708" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">customer model + key</text>

  <rect x="880" y="120" width="80" height="70" rx="10" fill="#fecaca" stroke="#64748b"/>
  <text x="892" y="150" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#172033">Boundary</text>
  <text x="888" y="168" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" fill="#5b6475">inform ≠</text>
  <text x="894" y="182" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" fill="#5b6475">execute</text>

  <path d="M190 155 H230" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 155 H460" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M650 155 H690" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- knowledge -->
  <rect x="40" y="306" width="170" height="70" rx="10" fill="#bfdbfe" stroke="#64748b"/>
  <text x="68" y="336" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Sample corpus</text>
  <text x="52" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">source/ PDFs · data/ md</text>

  <rect x="250" y="306" width="150" height="70" rx="10" fill="#c7d2fe" stroke="#64748b"/>
  <text x="292" y="336" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Ingest</text>
  <text x="268" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">chunk 800 / overlap 120</text>

  <rect x="440" y="306" width="150" height="70" rx="10" fill="#c7d2fe" stroke="#64748b"/>
  <text x="474" y="336" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Local BGE</text>
  <text x="456" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">embeddings on host</text>

  <rect x="630" y="306" width="150" height="70" rx="10" fill="#99f6e4" stroke="#64748b"/>
  <text x="672" y="336" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Chroma</text>
  <text x="648" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">vector index (local)</text>

  <path d="M210 341 H250" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M400 341 H440" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M590 341 H630" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M705 306 V220 H555 V196" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="715" y="270" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">retrieval at ask time</text>

  <!-- ops -->
  <rect x="40" y="474" width="200" height="70" rx="10" fill="#fde68a" stroke="#64748b"/>
  <text x="72" y="504" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Streamlit Secrets</text>
  <text x="58" y="524" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">LLM_API_KEY (not in git)</text>

  <rect x="270" y="474" width="200" height="70" rx="10" fill="#c7d2fe" stroke="#64748b"/>
  <text x="302" y="504" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Demo spend guards</text>
  <text x="284" y="524" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">10 Q / session · 5s cooldown</text>

  <rect x="500" y="474" width="200" height="70" rx="10" fill="#99f6e4" stroke="#64748b"/>
  <text x="528" y="504" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Query event log</text>
  <text x="514" y="524" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">latency · tokens · est. cost</text>

  <rect x="730" y="474" width="200" height="70" rx="10" fill="#c7d2fe" stroke="#64748b"/>
  <text x="788" y="504" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#172033">Eval gate</text>
  <text x="752" y="524" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">golden questions · 7/7 sample</text>

  <path d="M325 196 V474" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M555 196 V474" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="28" y="604" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5b6475">Interactive HTML: docs/diagrams/demo-streamlit-architecture.html · Production Path A/B: docs/diagrams/production-deploy-architecture.html</text>
</svg>
